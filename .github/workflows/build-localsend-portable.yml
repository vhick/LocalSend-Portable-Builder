name: Build LocalSend True Portable ZIP (Manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Official stable release number, e.g. 1.18.2 (without v)'
        required: true
        default: '1.18.2'
        type: string
      architecture:
        description: 'Windows CPU architecture (x64 for most PCs)'
        required: true
        default: 'x64'
        type: choice
        options:
          - x64
          - arm64

permissions:
  contents: read

concurrency:
  group: localsend-portable-manual-build
  cancel-in-progress: false

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out this builder repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling for the original icon
        run: python -m pip install "Pillow>=10,<13"

      - name: Run offline builder tests before downloading
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Package official LocalSend ZIP and compile launcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCAL_VERSION: ${{ inputs.version }}
          LOCAL_ARCH: ${{ inputs.architecture }}
        run: python builder/build_portable.py --version "$env:LOCAL_VERSION" --architecture "$env:LOCAL_ARCH" --work "."

      - name: Upload portable ZIP (no user settings included)
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-${{ inputs.version }}-${{ inputs.architecture }}-TruePortable
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 3
